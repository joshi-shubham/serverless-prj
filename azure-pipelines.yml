trigger:
- azureDeployment

resources:
- repo: self

pool: MyPool  # ✅ Your self-hosted agent pool name

variables:
  imageName: 'shubjoshi/myapp'   # Docker Hub repo name
  tag: 'MyAppPool'               # Custom tag (can use $(Build.BuildId) if dynamic)

stages:
- stage: Build
  displayName: Build and Push Docker Image
  jobs:
  - job: Build
    displayName: Build and Push
    steps:

    - task: CmdLine@2
      displayName: Show working directory contents
      inputs:
        script: ls

    - task: Docker@2
      displayName: Build Docker image
      inputs:
        command: build
        dockerfile: './Dockerfile'
        tags: |
          $(imageName):$(tag)

    - task: CmdLine@2
      displayName: Docker Login to Docker Hub
      inputs:
        script: |
          echo "$(DOCKERHUB_PASS)" | docker login --username shubjoshi --password-stdin

    - task: Docker@2
      displayName: Push Docker image to Docker Hub
      inputs:
        command: push
        tags: |
          $(imageName):$(tag)
