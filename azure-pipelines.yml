trigger:
- azureDeployment

resources:
- repo: self

pool: MyPool  # ✅ Your self-hosted agent pool

variables:
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: Build image
  jobs:
  - job: Build
    displayName: Build Docker Image
    steps:

    - task: CmdLine@2
      displayName: Show working directory
      inputs:
        script: pwd

    - task: Docker@2
      displayName: Build Docker image
      inputs:
        command: build
        dockerfile: '**/Dockerfile'  # Adjust this if it's not matching the actual path
        tags: |
          $(tag)

    - task: CmdLine@2
      displayName: Docker Login & List Images
      inputs:
        script: |
          echo "$(DOCKERHUB_PASS)" | docker login --username shubjoshi --password-stdin
          docker images
