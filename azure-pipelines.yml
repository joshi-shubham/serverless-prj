trigger:
- azureDeployment

resources:
- repo: self

pool: MyPool  # Your self-hosted agent pool

variables:
  imageName: 'shubjoshi/myapp'   # Docker Hub image name
  tag: 'MyAppPool'               # Custom tag

stages:
- stage: Build
  displayName: Build and Push Docker Image
  jobs:
  - job: Build
    displayName: Build and Push
    steps:

    - task: CmdLine@2
      displayName: Show working directory
      inputs:
        script: ls

    - task: Docker@2
      displayName: Build Docker Image
      inputs:
        command: build
        repository: $(imageName)      # 👈 set repository (image name)
        tags: |
          $(tag)                      # 👈 set tag (e.g. MyAppPool)
        dockerfile: ./Dockerfile      # Adjust if your Dockerfile is in a subfolder

    - task: CmdLine@2
      displayName: Docker Login to Docker Hub
      inputs:
        script: |
          echo "$(DOCKERHUB_PASS)" | docker login --username shubjoshi --password-stdin

    - task: Docker@2
      displayName: Push Docker Image
      inputs:
        command: push
        repository: $(imageName)      # 👈 same image name
        tags: |
          $(tag)                      # 👈 same tag
